[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awesome-ai-governance-toolkit"
version = "1.0.1"
description = "Runtime firewall for LLMs — policy-as-code, PII scrubbing, SHA-256 audit chain and HITL dashboard. EU AI Act + NIST AI RMF compliant."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Aryanshanu" }]
keywords = [
    "ai", "governance", "llm", "security", "compliance",
    "eu-ai-act", "nist", "audit", "pii", "firewall",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.4",
    "streamlit>=1.38.0",
    "requests>=2.31.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "pandas>=2.2.1",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.2", "httpx>=0.27.0"]

[project.urls]
Homepage      = "https://github.com/Aryanshanu/awesome-ai-governance-toolkit"
Repository    = "https://github.com/Aryanshanu/awesome-ai-governance-toolkit"
Issues        = "https://github.com/Aryanshanu/awesome-ai-governance-toolkit/issues"
Changelog     = "https://github.com/Aryanshanu/awesome-ai-governance-toolkit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Aryanshanu/awesome-ai-governance-toolkit#readme"

[project.scripts]
ai-governance-serve     = "ai_governance_toolkit.cli:serve"
ai-governance-dashboard = "ai_governance_toolkit.cli:dashboard"

[tool.hatch.build.targets.wheel]
packages = ["src", "ai_governance_toolkit"]

[tool.hatch.build.targets.wheel.force-include]
"sentinel.py" = "sentinel.py"
"config"      = "config"

[tool.hatch.build.targets.sdist]
include = [
    "sentinel.py",
    "src/**",
    "ai_governance_toolkit/**",
    "config/**",
    "assets/**",
    "dashboard.py",
    "requirements.txt",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
]
