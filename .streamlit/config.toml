[theme]
base            = "dark"
primaryColor    = "#00d4aa"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor       = "#dae3ee"
font            = "sans serif"

[server]
headless        = true
enableCORS      = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
