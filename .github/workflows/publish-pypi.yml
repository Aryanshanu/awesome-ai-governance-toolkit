name: Publish to PyPI

# Triggers on any tag matching v* (e.g. v1.0.0, v1.2.3)
# Setup: add PYPI_API_TOKEN to repo secrets at
# https://github.com/Aryanshanu/awesome-ai-governance-toolkit/settings/secrets/actions

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build toolchain
        run: pip install hatchling build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
